name: Screenshots

# Renders the desktop ScreenshotCatalog (the real Compose screens, fed with FakeData) to PNG on a
# GitHub runner and commits the images to the pushed branch, under screenshots/. It serves design
# review from a session that cannot build the app itself: the images come back with a git pull.
#
# Opt-in: a push runs it only when its last commit message asks for it. [screenshots] renders the
# default list below, [screenshots: a,b] those catalog entries, [screenshots: all] the whole catalog.
# Covers and posters are real ones, fetched from TMDB and Google Books with the repository's keys.
# The images are review material, not part of the app: delete screenshots/ before the branch is merged.

on:
  push:
    branches: ['claude/**']

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    if: contains(github.event.head_commit.message, '[screenshots')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only the two catalogue keys the covers need; the screens themselves run on fake data.
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
      COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      # Default catalog entries, see composeApp/src/desktopMain/.../tools/ScreenshotCatalog.kt.
      ONLY: books-detail-dark,books-add-dark,movies-detail-dark,movies-add-dark,series-detail-dark,series-add-dark,settings-full-dark

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The Android plugin is applied to the project even for a desktop task, so it needs a SDK
      # to configure. Fake data only: no backend key is needed.
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'

      - name: Render
        working-directory: native
        run: |
          rm -rf "$GITHUB_WORKSPACE/screenshots"
          asked=$(printf '%s' "$COMMIT_MESSAGE" | sed -n 's/.*\[screenshots: *\([^]]*\)\].*/\1/p' | head -n 1)
          only=()
          if [ -z "$asked" ]; then only=(-Ponly="$ONLY"); elif [ "$asked" != "all" ]; then only=(-Ponly="$asked"); fi
          ./gradlew :composeApp:screenshots --console=plain \
            -PoutDir="$GITHUB_WORKSPACE/screenshots" -Plocale=fr -Pcovers -PsettleMs=3000 "${only[@]}"

      - name: Commit to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A screenshots
          if git diff --cached --quiet; then echo "No change in the images."; exit 0; fi
          git commit -m "chore: captures d'écran de ${GITHUB_SHA::7}"
          # A push may have landed meanwhile; the images touch nothing else, so a rebase is safe.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
