name: Android release

# Builds the signed Play Store bundle on GitHub's runners and sends it to a Play testing track.
# Releasing is: Actions -> Android release -> Run workflow. Setup and procedure: RELEASE.md.
#
# Two modes:
# - Run by hand: a real release. Picks the version, builds the signed AAB, uploads it to Play when
#   PLAY_SERVICE_ACCOUNT_JSON is set, then tags the commit android-vX.Y.Z. Anything missing that
#   would ship a broken app (signing key, a backend key, Firebase) stops the run instead.
# - On a push touching what R8 depends on (Gradle files, ProGuard rules, this file): a check. The
#   same minified release build, nothing uploaded or tagged. Debug builds never run R8, so this is
#   the only place a broken keep rule shows up before a release does.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version X.Y.Z. Leave empty to take the last released version and add 1 to its last number'
        required: false
        default: ''
      track:
        description: 'Play track: internal = internal testing, alpha = closed testing'
        type: choice
        options: [internal, alpha]
        default: internal
      status:
        description: 'completed = testers get it right away; draft = it waits in Play Console for you to roll it out'
        type: choice
        options: [completed, draft]
        default: completed
  push:
    branches: [main, 'claude/**']
    paths:
      - 'native/**/*.gradle.kts'
      - 'native/gradle/**'
      - 'native/composeApp/proguard-rules.pro'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

# Never cancel a release halfway: an upload that dies after Play has accepted the bundle still
# consumes its versionCode.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        # Explicit so that run steps get -o pipefail: the build is piped through tee.
        shell: bash

    outputs:
      version: ${{ steps.version.outputs.name }}

    # The build reads these from native/secrets.properties or from environment variables of the
    # same name (see composeApp/build.gradle.kts). The signing key and the Play credentials are
    # deliberately not here: only the steps that need them see them.
    env:
      IS_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      GOOGLE_AUTH_WEB_CLIENT_ID: ${{ secrets.GOOGLE_AUTH_WEB_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The tags are how the next version number is found.
          fetch-depth: 0

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          fail() { echo "::error::$1"; echo "### Release stopped" >> "$GITHUB_STEP_SUMMARY"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; exit 1; }

          default=$(sed -n 's/.*gradleProperty("appVersionName").orNull ?: "\([^"]*\)".*/\1/p' native/composeApp/build.gradle.kts)
          last=$(git tag --list 'android-v*' --sort=-v:refname | head -1)
          last=${last#android-v}

          if [ "$IS_RELEASE" != "true" ]; then
            # A check build keeps whatever the Gradle file says.
            v=$default
          elif [ -n "$INPUT_VERSION" ]; then
            v=${INPUT_VERSION#v}
          elif [ -n "$last" ]; then
            IFS=. read -r a b c <<< "$last"
            v="$a.$b.$((c + 1))"
          else
            v=$default
          fi

          [[ "$v" =~ ^([0-9]+)\.([0-9]{1,2})\.([0-9]{1,2})$ ]] \
            || fail "Version \"$v\" is not X.Y.Z with Y and Z between 0 and 99."
          code=$(( 10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]} ))

          if [ "$IS_RELEASE" = "true" ]; then
            if git rev-parse -q --verify "refs/tags/android-v$v" > /dev/null; then
              fail "android-v$v already exists: that version has been released. Leave the version empty to get the next one."
            fi
            if [ -n "$last" ] && [ "$(printf '%s\n%s\n' "$last" "$v" | sort -V | tail -1)" != "$v" ]; then
              fail "$v is lower than the last release, $last. Play refuses a versionCode lower than one it has already seen."
            fi
          fi

          echo "Version $v, versionCode $code"
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'

      - uses: gradle/actions/setup-gradle@v4

      # Each key left empty builds fine and ships an app where a feature is quietly dead. A check
      # build reports them; a release refuses to go out with them.
      - name: Backend keys
        run: |
          : > "$RUNNER_TEMP/missing.md"
          for k in SUPABASE_URL SUPABASE_ANON_KEY API_BASE_URL GOOGLE_BOOKS_API_KEY TMDB_API_KEY GOOGLE_AUTH_WEB_CLIENT_ID; do
            if [ -z "${!k}" ]; then echo "- \`$k\`" >> "$RUNNER_TEMP/missing.md"; fi
          done
          if [ -s "$RUNNER_TEMP/missing.md" ]; then
            {
              echo "### Repository secrets missing"
              echo
              cat "$RUNNER_TEMP/missing.md"
              echo
              echo "Same values as \`native/secrets.properties\`, under Settings -> Secrets and variables -> Actions."
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::Backend keys missing, see the run summary."
              exit 1
            fi
          fi

      # Push notifications. The release variant needs a client for fr.paulbr.nookmind itself;
      # the secret is the same file the debug workflow uses, which declares both packages.
      - name: google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          dest=native/composeApp/google-services.json
          problem=""
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            problem="The GOOGLE_SERVICES_JSON secret is not set."
          else
            if [ "$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | cut -c1)" = '{' ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > "$dest"
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > "$dest" 2>/dev/null || true
            fi
            if ! jq -e . "$dest" > /dev/null 2>&1; then
              problem="The GOOGLE_SERVICES_JSON secret is neither the file's JSON nor its base64."
            elif ! jq -e '.client[].client_info.android_client_info.package_name
                          | select(. == "fr.paulbr.nookmind")' "$dest" > /dev/null; then
              problem="google-services.json declares no client for fr.paulbr.nookmind."
            fi
          fi
          if [ -n "$problem" ]; then
            rm -f "$dest"
            { echo "### No push notifications in this build"; echo; echo "$problem"; } >> "$GITHUB_STEP_SUMMARY"
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::$problem"
              exit 1
            fi
          fi

      # The upload key. Play App Signing re-signs what testers install with Google's own key;
      # this one only proves to Play that the bundle comes from us.
      - name: Signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::RELEASE_KEYSTORE_BASE64 and RELEASE_KEYSTORE_PASSWORD are required to release. See RELEASE.md."
              exit 1
            fi
            echo "No signing secrets: this check build stays unsigned."
            exit 0
          fi

          jks="$RUNNER_TEMP/upload.jks"
          # A secret that is not valid base64 is reported by the keytool check just below.
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$jks" 2>/dev/null || true
          alias=${RELEASE_KEY_ALIAS:-nookmind}
          keypass=${RELEASE_KEY_PASSWORD:-$RELEASE_KEYSTORE_PASSWORD}

          if ! keytool -list -keystore "$jks" -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$alias" > /dev/null 2>&1; then
            echo "::error::The keystore does not open with this password, or has no key named \"$alias\". Check RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD and RELEASE_KEY_ALIAS."
            exit 1
          fi

          # java.util.Properties reads a backslash as an escape: double them so any password survives.
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            echo "storeFile=$jks"
            echo "storePassword=$(esc "$RELEASE_KEYSTORE_PASSWORD")"
            echo "keyAlias=$(esc "$alias")"
            echo "keyPassword=$(esc "$keypass")"
          } > native/keystore.properties

      - name: Build
        working-directory: native
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          ./gradlew :composeApp:bundleRelease :composeApp:assembleRelease \
            -PappVersionName="$VERSION" --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      # What actually came out, read back from the files rather than assumed from the config.
      - name: Inspect the build
        id: inspect
        env:
          VERSION: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          aab=native/composeApp/build/outputs/bundle/release/composeApp-release.aab
          apk=$(find native/composeApp/build/outputs/apk/release -name '*.apk' | head -1)
          [ -f "$aab" ] || { echo "::error::The build reported success but produced no AAB."; exit 1; }

          sha1=$(keytool -printcert -jarfile "$aab" 2>/dev/null | sed -n 's/^[[:space:]]*SHA1: //p' | head -1)
          if [ -z "$sha1" ] && [ "$IS_RELEASE" = "true" ]; then
            echo "::error::The AAB is not signed: native/keystore.properties was not picked up."
            exit 1
          fi

          # Play Console's data safety form says NookMind has no advertising ID. A library that
          # adds the permission makes that answer false, and Play blocks the release over it.
          aapt2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -1)
          perms=""
          if [ -n "$aapt2" ] && [ -n "$apk" ]; then
            perms=$("$aapt2" dump permissions "$apk" 2>/dev/null | sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p")
            if printf '%s\n' "$perms" | grep -q 'com.google.android.gms.permission.AD_ID'; then
              echo "::error::The app now requests the advertising ID (AD_ID). Either remove it from the manifest or change the Play Console declaration before releasing."
              if [ "$IS_RELEASE" = "true" ]; then exit 1; fi
            fi
          fi

          r8=$(grep -c "parsing kotlin metadata" "$RUNNER_TEMP/build.log" || true)

          mkdir -p out
          cp "$aab" "out/NookMind-$VERSION.aab"
          if [ -n "$apk" ]; then cp "$apk" "out/NookMind-$VERSION.apk"; fi
          cp native/composeApp/build/outputs/mapping/release/mapping.txt "out/mapping-$VERSION.txt"

          {
            if [ "$IS_RELEASE" = "true" ]; then echo "### NookMind $VERSION ($CODE)"; else echo "### Release check build $VERSION ($CODE)"; fi
            echo
            if [ -n "$sha1" ]; then echo "Signed with the upload key, SHA-1 \`$sha1\`."; else echo "Unsigned (no signing secrets)."; fi
            echo
            echo "R8 Kotlin metadata errors: $r8"
            echo
            if [ -n "$perms" ]; then
              echo "<details><summary>Permissions requested</summary>"
              echo
              printf '%s\n' "$perms" | sed 's/^/- /'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Upload key SHA-1: ${sha1:-none}. R8 Kotlin metadata errors: $r8"
          # In the log as well: the summary is a rendered page that cannot be read back from the build output.
          if [ -n "$perms" ]; then
            echo "Permissions requested:"; printf '  %s\n' $perms
          else
            echo "::warning::Permissions not read (aapt2 or APK not found): the AD_ID check did not run."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nookmind-release-${{ steps.version.outputs.name }}
          path: out/
          if-no-files-found: error
          retention-days: 90

      - name: Play credentials
        id: play
        if: env.IS_RELEASE == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "### Not sent to Play"
              echo
              echo "PLAY_SERVICE_ACCOUNT_JSON is not set. Download the .aab from this run's artifacts and"
              echo "upload it by hand in Play Console. Google requires the very first upload to be manual"
              echo "anyway; after that, set the secret and the next runs upload on their own (RELEASE.md)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Send to Play
        if: steps.play.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: fr.paulbr.nookmind
          releaseFiles: out/NookMind-${{ steps.version.outputs.name }}.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          whatsNewDirectory: native/distribution/whatsnew
          mappingFile: out/mapping-${{ steps.version.outputs.name }}.txt

      - name: Sent
        if: steps.play.outputs.ready == 'true'
        env:
          TRACK: ${{ inputs.track }}
          STATUS: ${{ inputs.status }}
        run: |
          {
            echo "### Sent to Play, track \`$TRACK\`, status \`$STATUS\`"
            echo
            echo "Internal testing is usually installable within minutes. Closed testing goes through"
            echo "Google review first. The R8 mapping went with it, so crash reports in Play Console"
            echo "show real class and method names."
          } >> "$GITHUB_STEP_SUMMARY"

  # Separate job so that only this step, after a successful release, can write to the repository.
  tag:
    needs: release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag android-v${{ needs.release.outputs.version }}
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          git tag "android-v$VERSION" "$GITHUB_SHA"
          git push origin "android-v$VERSION"
