name: Android debug APK

# Builds an installable debug APK on GitHub's runners and attaches it to the run, so
# getting an APK never depends on the local machine: the runner already has the Android
# SDK, a JDK 17 and an unfiltered route to Google's Maven repository.
#
# Download it from: repository -> Actions -> the run -> Artifacts -> nookmind-debug-apk.
# It arrives as a .zip with the .apk inside.

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'native/**'
      - '!native/**/*.md'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # The build reads every key from native/secrets.properties *or* from an environment
    # variable of the same name. That file is git-ignored, so on CI these are the source.
    # A key left unset does not fail the build; it produces an app where the matching
    # feature is quietly dead, which the "What is missing" step below reports.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      GOOGLE_AUTH_WEB_CLIENT_ID: ${{ secrets.GOOGLE_AUTH_WEB_CLIENT_ID }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36'

      - uses: gradle/actions/setup-gradle@v4

      # Without this the APK is signed with a key AGP generates fresh on every runner, so
      # each build refuses to replace the previous install and Google Sign-In rejects the app
      # (the Credential Manager needs an Android OAuth client registered for this exact
      # applicationId and SHA-1). The secret pins one key for every build.
      - name: debug.keystore, when the secret is set
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > native/composeApp/debug.keystore
          sha1=$(keytool -list -v -keystore native/composeApp/debug.keystore \
                   -storepass android -alias androiddebugkey 2>/dev/null \
                 | sed -n 's/.*SHA1: //p')
          if [ -z "$sha1" ]; then
            echo "The secret did not decode to a readable keystore."
            exit 1
          fi
          # Printed to the log too, not only the job summary: the summary is a rendered page,
          # so a fingerprint that lives only there cannot be read back from the build output.
          echo "Signing key SHA-1: $sha1"
          {
            echo "### Signed with the pinned debug key"
            echo
            echo "SHA-1: \`$sha1\`"
            echo
            echo "This is the fingerprint to register in Firebase for \`fr.paulbr.nookmind.debug\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # Firebase Cloud Messaging only. Optional: without it the build succeeds and push
      # notifications are the one feature that stays off.
      #
      # The secret holds either the file's JSON or its base64, whichever was easier to produce.
      # Demanding one of the two only creates a way to get it wrong, so both are accepted.
      #
      # The debug variant carries the .debug applicationId suffix, and the google-services
      # plugin fails the build outright on a variant it has no client for. A file without
      # that client is therefore worse than no file at all, so it is dropped rather than used.
      - name: google-services.json, when the secret is set
        if: env.GOOGLE_SERVICES_JSON != ''
        run: |
          dest=native/composeApp/google-services.json
          if [ "$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | cut -c1)" = '{' ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$dest"
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > "$dest" 2>/dev/null || true
          fi

          if ! jq -e . "$dest" > /dev/null 2>&1; then
            rm -f "$dest"
            {
              echo "### google-services.json ignored"
              echo
              echo "The secret is neither the file's JSON nor its base64, so it was dropped and"
              echo "the build continued without push notifications. Paste the whole contents of"
              echo "the file downloaded from the Firebase console, opening brace included."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! jq -e '.client[].client_info.android_client_info.package_name
                      | select(. == "fr.paulbr.nookmind.debug")' "$dest" > /dev/null; then
            rm "$dest"
            {
              echo "### google-services.json ignored"
              echo
              echo "It declares no client for \`fr.paulbr.nookmind.debug\`, which the debug"
              echo "variant needs, so it was dropped and the build continued without push"
              echo "notifications. Add that package name as a second Android app in the"
              echo "Firebase project, download the file again, and update the secret."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        working-directory: native
        run: ./gradlew :composeApp:assembleDebug --no-daemon --stacktrace

      - name: What is missing
        if: always()
        run: |
          report() {
            if [ -z "$2" ]; then
              echo "- \`$1\` -> $3" >> /tmp/missing.md
            fi
          }
          : > /tmp/missing.md
          report SUPABASE_URL              "$SUPABASE_URL"              "sign-in and the whole library"
          report SUPABASE_ANON_KEY         "$SUPABASE_ANON_KEY"         "sign-in and the whole library"
          report API_BASE_URL              "$API_BASE_URL"              "IMDb ratings, watch providers, account deletion"
          report GOOGLE_BOOKS_API_KEY      "$GOOGLE_BOOKS_API_KEY"      "book search (works unauthenticated, but rate limited)"
          report TMDB_API_KEY              "$TMDB_API_KEY"              "movie and series search, and the whole Next Up tab"
          report GOOGLE_AUTH_WEB_CLIENT_ID "$GOOGLE_AUTH_WEB_CLIENT_ID" "Google sign-in"
          report DEBUG_KEYSTORE_BASE64      "$DEBUG_KEYSTORE_BASE64"      "a stable signature: this APK cannot replace an install signed elsewhere, and Google sign-in refuses it"
          if [ -s /tmp/missing.md ]; then
            {
              echo "### Repository secrets missing"
              echo
              echo "The APK builds without them, but each one silently disables a feature:"
              echo
              cat /tmp/missing.md
              echo
              echo "Add them under Settings -> Secrets and variables -> Actions, then re-run."
              echo "The values are the ones already in \`native/secrets.properties\`, same names."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect the APK
        run: |
          apk=$(find native/composeApp/build/outputs/apk/debug -name '*.apk' | head -1)
          if [ -z "$apk" ]; then echo "The build reported success but produced no APK."; exit 1; fi
          mkdir -p out
          cp "$apk" out/NookMind-debug.apk

          # The fingerprint of the certificate that actually signed this file, read back from the
          # file itself. The keystore step prints what it *intends* to sign with; this proves the
          # signing config was applied. It is the value Google matches against the Android OAuth
          # client, so a Google sign-in that fails on identity is checked against this, not a guess.
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          if [ -n "$signer" ]; then
            fp=$("$signer" verify --print-certs out/NookMind-debug.apk 2>/dev/null \
                 | sed -n 's/.*certificate SHA-1 digest: *//p' | head -1 \
                 | tr 'a-z' 'A-Z' | sed 's/../&:/g; s/:$//')
            [ -n "$fp" ] && echo "APK signature SHA-1: $fp"
            [ -n "$fp" ] && {
              echo "### Signature carried by this APK"
              echo
              echo "SHA-1: \`$fp\`"
              echo
              echo "This exact value must be registered in Firebase for \`fr.paulbr.nookmind.debug\`,"
              echo "which is what provisions the Android OAuth client that Google sign-in checks."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "### APK ready"
            echo
            echo "\`NookMind-debug.apk\`, $(du -h out/NookMind-debug.apk | cut -f1)."
            echo
            echo "Download it from the Artifacts section of this run, unzip it, send it to the phone."
            echo "It installs as a separate app (application id suffix \`.debug\`), so it sits next"
            echo "to a Play Store build instead of replacing it."
            echo
            echo "If Android refuses the install and mentions signatures, a debug APK built on"
            echo "another machine is already installed: uninstall \`fr.paulbr.nookmind.debug\` first."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: nookmind-debug-apk
          path: out/NookMind-debug.apk
          if-no-files-found: error
          retention-days: 30
