# Temporary: what Google Books answers the app's key, to explain a "search timed out" on book search.
name: Books probe
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/books-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
    steps:
      - name: French results, field by field
        run: |
          cat > shape.py <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          if "error" in d:
              print("   error:", json.dumps(d["error"])[:600])
          ids = [it.get("id") for it in d.get("items", [])]
          print("   items:", len(ids), "duplicate ids:", len(ids) != len(set(ids)), "totalItems:", d.get("totalItems"))
          def walk(x, path, out):
              if isinstance(x, dict):
                  for k, v in x.items(): walk(v, path + "." + k, out)
              elif isinstance(x, list):
                  for v in x: walk(v, path + "[]", out)
              out.setdefault(path, set()).add(type(x).__name__)
          shapes = {}
          for it in d.get("items", []):
              if "id" not in it: print("   NO ID:", json.dumps(it)[:300])
              walk(it.get("volumeInfo"), "volumeInfo", shapes)
          for p, t in sorted(shapes.items()):
              if p.split(".")[1].split("[")[0] in ("title", "authors", "description", "imageLinks", "publishedDate", "pageCount", "categories") or "NoneType" in t or len(t) > 1:
                  print("   ", p, sorted(t))
          PY
          for c in FR ""; do
            for q in Thi Thilliez "Franck Thilliez" Thilli; do
              curl -s -o out.json -w "[$c] $q -> %{http_code} in %{time_total}s, %{size_download} bytes\n" -G https://www.googleapis.com/books/v1/volumes \
                --data-urlencode "q=$q" -d maxResults=8 -d printType=books ${c:+-d country=$c} -d "key=$KEY"
              python3 shape.py out.json
              sleep 1
            done
          done
          curl -s -o thilliez-fr.json -G https://www.googleapis.com/books/v1/volumes --data-urlencode "q=Thilliez" -d maxResults=8 -d printType=books -d country=FR -d "key=$KEY"
      - uses: actions/upload-artifact@v4
        with:
          name: thilliez-fr
          path: thilliez-fr.json
